[pytest]
# Only collect the root integration suite. Without `testpaths`, a bare
# `pytest` invoked from repo root falls back to rootdir-wide discovery and
# crawls node_modules/, nn-templates/, terraform/, the venvs, and the per-app
# backend test dirs (which carry their own fixtures/conftest and collide with
# this suite's), producing dozens of collection errors.
testpaths = tests
# Note: setting norecursedirs in ini REPLACES pytest's built-in default list
# (node_modules, dist, build, .* dot-dirs, *.egg, _darcs, CVS, {arch}), so the
# defaults are repeated here alongside the repo's other non-test trees.
norecursedirs = .* *.egg _darcs build CVS dist {arch} node_modules nn-templates terraform scripts docs shared .issue-media nearby-admin/backend nearby-app/backend
addopts = -p no:pastebin -p no:doctest
